<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabHub 控制台</title>
    <link rel="stylesheet" href="styles/settings.css">
    <script defer src="config.js"></script>
    <script defer src="src/settings.js"></script>
    <script defer src="src/broadcast.js"></script>
    <script defer src="messages.js"></script>
    <script defer src="src/message-source.js"></script>
    <script defer src="src/console-tools.js"></script>
    <script defer src="src/console.js"></script>
    <script defer src="src/console-settings.js"></script>
</head>
<body>
<main>
    <header class="masthead">
        <h1><span class="brand-mark" aria-hidden="true"></span>TabHub <small>控制台</small></h1>
        <span id="connection" role="status"></span>
    </header>
    <aside class="sidebar" aria-label="Hub 与导航">
        <label class="hub-picker">当前 Hub<select id="hub"></select></label>
        <details class="hub-tools">
            <summary>管理显示端</summary>
            <form id="add-hub">
                <label>新 Hub ID<input id="hub-id" required pattern="[A-Za-z0-9_\-]{1,48}" maxlength="48" autocomplete="off" placeholder="break"></label>
                <button>添加</button>
            </form>
            <label>OBS 浏览器源 URL<input id="source-url" readonly></label>
        </details>
        <nav aria-label="控制台分页">
            <button data-page="cast" aria-controls="cast" aria-pressed="true">广播</button>
            <button data-page="logs" aria-controls="logs" aria-pressed="false">日志</button>
            <button data-page="library" aria-controls="library" aria-pressed="false">公告列表</button>
            <button data-page="preferences" aria-controls="preferences" aria-pressed="false">设置</button>
        </nav>
    </aside>
    <div class="workspace">
        <section id="cast" aria-label="广播">
            <div class="panel-heading"><h2>实时公告</h2>
                <label class="target">发送目标<select id="scope"><option value="current">当前 Hub</option><option value="selected">指定多个 Hub</option><option value="all">全部在线 Hub</option></select></label>
            </div>
            <div id="recipients" hidden></div>
            <div class="composer">
                <textarea aria-label="实时公告内容" id="message" rows="4" autocomplete="off" placeholder="输入公告内容…"></textarea>
                <div class="composer-actions"><button id="send" class="primary">发送公告</button></div>
            </div>
            <output id="delivery" role="status"></output>
            <div class="transport"><h3>轮播控制</h3>
                <div class="actions"><button data-command="toggle">暂停／启动轮播</button><button data-command="clear">清空公告</button><button data-command="next">下一条</button></div>
            </div>
        </section>
        <section id="preferences" hidden>
            <h2>当前 Hub 设置</h2>
            <label>设置分组<select id="section"></select></label>
            <form id="options" autocomplete="off"></form>
            <div class="actions"><button id="restore">重置本组</button><button class="primary" id="save-config">保存全部 Hub 配置</button></div>
            <output id="feedback" role="status"></output>
            <output id="applied" role="status"></output>
        </section>
        <section id="library" hidden>
            <div class="panel-heading"><h2>轮播公告</h2><a href="messages-editor.html" target="_blank" rel="noopener">打开独立编辑器</a></div>
            <div class="actions"><select aria-label="新增条目类型" id="entry-kind"><option value="text">纯文本</option><option value="rich">富文本</option><option value="queue">队列</option><option value="pack">条件包</option></select><button id="add-entry">添加条目</button><button class="primary" id="save-messages">保存 messages.js</button></div>
            <output id="message-state" role="status"></output>
            <ol id="entries"></ol>
        </section>
        <section id="logs" hidden><div class="panel-heading"><h2>会话日志</h2><button id="clear-log">清空日志</button></div><ol id="log-list"></ol></section>
    </div>
</main>
</body>
</html>
